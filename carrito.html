<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="assets/images/logo png.png">
  <meta name="description" content="paso · 01 — soporte de TV | Hecho para moverse con vos.">
  <meta property="og:title" content="paso · 01">
  <meta property="og:description" content="paso · 01 Diseñado y fabricado en Argentina.">
  <meta property="og:image" content="https://paso-ar.com/assets/images/paso en horizontal.png">
  <meta property="og:url" content="https://paso-ar.com">
  <meta property="og:type" content="website">
  <title>Carrito — paso</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    @font-face { font-family:'All Round Gothic'; src:url('assets/fonts/Fontspring-DEMO-allroundgothic-book.otf') format('opentype'); font-weight:400; font-display:swap; }
    @font-face { font-family:'All Round Gothic'; src:url('assets/fonts/Fontspring-DEMO-allroundgothic-medium.otf') format('opentype'); font-weight:500; font-display:swap; }
    @font-face { font-family:'All Round Gothic'; src:url('assets/fonts/Fontspring-DEMO-allroundgothic-bold.otf') format('opentype'); font-weight:700; font-display:swap; }
  </style>
  <style>
    :root {
      --color-bg: #faf8f6;
      --paso-carbon: #2A2623;
      --paso-madera: #9B8065;
      --paso-avena: #EFE9DC;
      --color-text: #2A2623;
      --color-muted: #9B8065;
      --font-display: 'All Round Gothic','Poppins',sans-serif;
      --font-body: 'Poppins',sans-serif;
      --margin-side: 48px;
      --ease: cubic-bezier(0.25,0.46,0.45,0.94);
    }
    html { font-size: 62.5%; }
    body { background: #faf8f6; margin: 0; }

    /* ── NAVBAR píldora flotante ── */
    #navbar {
      position: fixed; left: 50%; top: 1.6rem;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex; align-items: center;
      width: max-content;
    }
    .nav-bg {
      position: absolute; pointer-events: none;
      height: calc(4.4rem + 1.2rem); width: calc(100% + 1.2rem);
      top: -0.6rem; left: -0.6rem;
      border-radius: 1.6rem;
      border: 1px solid rgba(42,38,35,0.12);
      background: #faf8f6;
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }
    .nav-hl {
      position: absolute; pointer-events: none;
      background: white; border-radius: 1.2rem; height: 4.4rem;
      transition: width 0.28s cubic-bezier(0.25,0.46,0.45,0.94), left 0.28s cubic-bezier(0.25,0.46,0.45,0.94), opacity 0.2s;
      opacity: 0;
    }
    .nav-item {
      position: relative; display: flex; align-items: center;
      height: 4.4rem; padding: 0 1.6rem;
      font-size: 1.3rem; font-weight: 500;
      color: #2A2623; white-space: nowrap; cursor: pointer;
      border-radius: 1.2rem; font-family: 'Poppins', sans-serif;
      text-decoration: none;
    }
    .nav-logo { font-family: 'All Round Gothic', 'Poppins', sans-serif; font-size: 1.7rem; letter-spacing: 0.04em; color: #b92c1d; }
    .nav-carrito { gap: 4px; }
    .nav-carrito svg { width: 1.6rem; height: 1.6rem; }

    /* ── CARRITO ── */
    .cart-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 120px 48px 64px;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 64px;
      align-items: start;
    }

    .cart-heading {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: clamp(32px, 4vw, 56px);
      letter-spacing: -0.02em;
      color: var(--paso-carbon);
      margin-bottom: 8px;
      line-height: 1;
    }
    .cart-count-label {
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #b92717;
      margin-bottom: 40px;
      display: block;
    }

    /* Items */
    .cart-item {
      display: grid;
      grid-template-columns: 100px 1fr auto;
      gap: 24px;
      align-items: center;
      padding: 24px 0;
      border-bottom: 0.5px solid rgba(42,38,35,0.15);
    }
    .cart-item__img { width: 100px; height: 100px; object-fit: contain; }
    .cart-item__name { font-family: var(--font-body); font-weight: 500; font-size: 15px; color: var(--paso-carbon); margin-bottom: 4px; }
    .cart-item__variant { display: none; }
    .cart-item__controls { display: flex; align-items: center; gap: 0; border: 0.5px solid rgba(42,38,35,0.3); width: fit-content; }
    .cart-qty-btn { width: 32px; height: 32px; background: none; border: none; cursor: pointer; font-size: 16px; color: var(--paso-carbon); display: flex; align-items: center; justify-content: center; }
    .cart-qty-btn:hover { background: rgba(42,38,35,0.05); }
    .cart-item__qty { min-width: 32px; text-align: center; font-family: var(--font-body); font-size: 13px; font-weight: 500; color: var(--paso-carbon); }
    .cart-item__remove { font-family: var(--font-body); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: #b92717; background: none; border: none; cursor: pointer; padding: 0; margin-top: 10px; display: block; }
    .cart-item__remove:hover { opacity: 0.7; }
    .cart-item__price { font-family: var(--font-body); font-weight: 500; font-size: 15px; color: var(--paso-carbon); text-align: right; white-space: nowrap; }
    .cart-item__price-orig { font-family: var(--font-body); font-size: 11px; color: #9B8065; text-decoration: line-through; display: block; text-align: right; }

    /* Summary */
    .cart-summary {
      position: sticky;
      top: 80px;
      border: 0.5px solid rgba(42,38,35,0.2);
      padding: 32px;
    }
    .cart-summary__title { font-family: var(--font-display); font-weight: 500; font-size: 18px; letter-spacing: -0.01em; color: var(--paso-carbon); margin-bottom: 24px; }
    .cart-summary__pack { font-family: var(--font-body); font-size: 11px; font-weight: 500; color: #2A8048; letter-spacing: 0.02em; margin-bottom: 14px; }
    .cart-summary__row { display: flex; justify-content: space-between; font-family: var(--font-body); font-size: 13px; color: var(--paso-carbon); padding: 10px 0; border-bottom: 0.5px solid rgba(42,38,35,0.1); }
    .cart-summary__row.total { font-weight: 600; font-size: 15px; border-bottom: none; padding-top: 16px; }
    .cart-summary__btn {
      display: block; width: 100%; margin-top: 24px; padding: 14px;
      background: #faf8f6; color: #2A2623;
      border: 1px solid #2A2623; border-radius: 10rem;
      font-family: var(--font-body); font-size: 11px; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.1em;
      text-align: center; text-decoration: none; cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .cart-summary__btn:hover { background: #2A2623; color: #faf8f6; }
    .cart-summary__btn--outline {
      display: block; width: 100%; margin-top: 10px; padding: 14px;
      background: none; color: var(--paso-madera);
      border: none; border-radius: 10rem;
      font-family: var(--font-body); font-size: 11px; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.1em;
      text-align: center; text-decoration: none;
      transition: color 0.2s;
    }
    .cart-summary__btn--outline:hover { color: #2A2623; }

    /* Cuotas */
    .cart-cuotas {
      margin: 20px 0 0;
      border-top: 0.5px solid rgba(42,38,35,0.12);
      padding-top: 20px;
    }
    .cart-cuotas__label {
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--paso-madera);
      margin-bottom: 10px;
      display: block;
    }
    .cuotas-options {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .cuota-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 0.5px solid rgba(42,38,35,0.08);
      gap: 12px;
    }
    .cuota-option:last-child { border-bottom: none; }
    .cuota-option__name {
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 500;
      color: var(--paso-carbon);
    }
    .cuota-option__name small {
      display: block;
      font-size: 10px;
      font-weight: 400;
      color: var(--paso-madera);
      margin-top: 1px;
    }
    .cuota-option__amount {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      color: var(--paso-carbon);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .cart-cuotas__note {
      font-family: var(--font-body);
      font-size: 10px;
      color: var(--paso-madera);
      margin-top: 10px;
      line-height: 1.5;
    }

    /* Vacío */
    .cart-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 120px 0;
    }
    .cart-empty__title { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: clamp(40px,6vw,80px); letter-spacing: -0.02em; color: var(--paso-carbon); margin-bottom: 16px; }
    .cart-empty__sub { font-family: var(--font-body); font-size: 13px; color: var(--paso-madera); margin-bottom: 40px; }
    .cart-empty__cta {
      display: inline-flex;
      align-items: center;
      padding: 1.2rem 2.6rem;
      background: #2A2623;
      color: #faf8f6;
      border-radius: 10rem;
      font-family: 'Poppins', sans-serif;
      font-size: 1.3rem;
      font-weight: 500;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .cart-empty__cta:hover { opacity: 0.8; }

    /* ── FOOTER ── */
    footer { margin-top: 10rem; position: relative; }
    .footer-brand { position: sticky; bottom: 0; height: 30vh; background: #b92c1d; overflow: hidden; z-index: 1; }
    .footer-word { display: block; text-align: center; font-family: 'All Round Gothic','Poppins',sans-serif; font-weight: 500; font-size: clamp(12rem, 22vw, 30rem); letter-spacing: -0.02em; line-height: 0.85; color: rgba(249,248,246,0.12); user-select: none; padding-top: 3rem; }
    .footer-card { position: relative; z-index: 2; background: #f9f8f6; border-radius: 0 0 4.8rem 4.8rem; }
    .footer-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 4rem; padding: 6rem 6rem 5rem; border-bottom: 0.5px solid rgba(42,38,35,0.15); }
    .footer-left { display: flex; flex-direction: column; gap: 3.2rem; max-width: 32rem; }
    .footer-tagline { font-family: 'Poppins',sans-serif; font-weight: 600; font-size: clamp(2.4rem, 3vw, 3.6rem); line-height: 1.15; letter-spacing: -0.02em; color: #2A2623; }
    .footer-tagline em { font-style: italic; font-weight: 400; }
    .footer-cta-btn { display: inline-flex; align-items: center; padding: 1.2rem 2.6rem; background: #2A2623; color: #f9f8f6; border-radius: 10rem; font-size: 1.3rem; font-weight: 500; font-family: 'Poppins',sans-serif; transition: opacity 0.2s; text-decoration: none; }
    .footer-cta-btn:hover { opacity: 0.8; }
    .footer-links { display: flex; gap: 5.6rem; }
    .footer-col h4 { font-size: 1.1rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: #b92c1d; margin-bottom: 1.6rem; }
    .footer-col a { display: block; font-size: 1.4rem; color: #2A2623; opacity: 0.55; margin-bottom: 1rem; transition: opacity 0.2s; text-decoration: none; }
    .footer-col a:hover { opacity: 1; }
    .footer-bottom { display: flex; flex-direction: column; align-items: center; gap: 1rem; padding: 2rem 6rem; }
    .footer-copy { font-size: 1.1rem; color: #2A2623; }
    .footer-legal { display: flex; gap: 2.4rem; }
    .footer-legal a { font-size: 1.1rem; color: #2A2623; opacity: 0.45; transition: opacity 0.2s; }
    .footer-legal a:hover { opacity: 1; }

    
    /* ── HAMBURGER + MOBILE MENU ── */
    .nav-hamburger {
      display: none;
      position: relative; z-index: 1;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 0.5rem; width: 4.4rem; height: 4.4rem;
      background: none; border: none; cursor: pointer; padding: 0;
    }
    .nav-hamburger span {
      display: block; width: 1.6rem; height: 1.5px;
      background: #2A2623; border-radius: 2px;
      transition: transform 0.28s cubic-bezier(0.25,0.46,0.45,0.94), opacity 0.2s;
    }
    .nav-hamburger.open span:nth-child(1) { transform: translateY(0.65rem) rotate(45deg); }
    .nav-hamburger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .nav-hamburger.open span:nth-child(3) { transform: translateY(-0.65rem) rotate(-45deg); }
    .mobile-menu {
      position: fixed; inset: 0;
      background: #faf8f4;
      z-index: 998;
      display: flex; flex-direction: column; justify-content: center;
      padding: 8rem 3.2rem 4rem;
      opacity: 0; pointer-events: none;
      transform: translateY(-0.8rem);
      transition: opacity 0.28s cubic-bezier(0.25,0.46,0.45,0.94), transform 0.28s cubic-bezier(0.25,0.46,0.45,0.94);
    }
    .mobile-menu.open { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .mobile-menu a {
      font-family: 'Poppins', sans-serif; font-weight: 500;
      font-size: 1.6rem; letter-spacing: 0.06em; text-transform: uppercase;
      color: #2A2623; padding: 1.8rem 0;
      border-bottom: 0.5px solid rgba(42,38,35,0.12);
      opacity: 0.7; transition: opacity 0.2s; text-decoration: none; display: block;
    }
    .mobile-menu a:first-of-type { border-top: 0.5px solid rgba(42,38,35,0.12); }
    .mobile-menu a:hover { opacity: 1; }
    .mobile-menu__close {
      position: absolute; top: 2rem; right: 2.4rem;
      background: none; border: none; cursor: pointer;
      font-size: 2.2rem; color: #2A2623; line-height: 1;
      width: 4rem; height: 4rem;
      display: flex; align-items: center; justify-content: center;
    }

    @media (max-width: 768px) {
      .nav-hamburger { display: flex !important; }
      #navbar { padding: 0 !important; width: max-content !important; }
      .nav-item:not(.nav-logo):not(.nav-carrito) { display: none !important; }

      .cart-wrap { grid-template-columns: 1fr !important; padding: 100px 16px 80px !important; gap: 32px !important; }

      .cart-heading { font-size: 28px !important; margin-bottom: 4px !important; font-family: var(--font-body) !important; font-weight: 600 !important; letter-spacing: -0.01em !important; }
      .cart-count-label { margin-bottom: 20px !important; }

      .cart-item { grid-template-columns: 80px 1fr !important; gap: 14px !important; padding: 16px 0 !important; }
      .cart-item__img { width: 80px !important; height: 80px !important; }
      .cart-item__price { font-size: 13px !important; }
      .cart-item__price-orig { font-size: 10px !important; }

      .cart-summary { position: static !important; padding: 20px !important; }
      .cart-summary__btn { width: 100% !important; text-align: center !important; padding: 14px !important; font-size: 11px !important; }
      .cart-summary__btn--outline { width: 100% !important; text-align: center !important; padding: 14px !important; font-size: 11px !important; }

      .cart-cuotas { padding: 16px 0 !important; }
      .cuotas-options { gap: 8px !important; }
      .cuota-option { padding: 12px !important; }

      .footer-card { border-radius: 0 0 1.6rem 1.6rem !important; }
      .footer-top { flex-direction: column !important; gap: 4rem !important; padding: 4rem 2.4rem 3rem !important; }
      .footer-links { flex-direction: row !important; gap: 2rem !important; flex-wrap: wrap !important; }
    }
  </style>
</head>
<body>

<!-- ── NAVBAR ── -->
<nav id="navbar">
  <div class="nav-bg"></div>
  <div class="nav-hl" id="nav-hl"></div>
  <a href="index.html" class="nav-item nav-logo" aria-label="paso inicio">.paso</a>
  <a href="producto.html" class="nav-item">Producto</a>

    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>

    <a href="producto.html">Producto</a>
    <a href="accesorios.html">Accesorios</a>
    <a href="shop.html">Shop</a>
    <a href="sobre-nosotros.html">La marca</a>
    <a href="carrito.html">Carrito</a>
  </div>

<main>
  <div class="cart-wrap" id="cart-root"></div>
</main>

<!-- ── FOOTER ── -->


<script src="cart.js"></script>
<script src="accesorios-panel.js"></script>
<script>
  const itemImgMap = {
    'paso-01':     { navy: 'assets/images/render-azul.png', verde: 'assets/images/render-azul.png', gris: 'assets/images/render-gris.png', negro: 'assets/images/render-gris.png' },
    'pack-01':     { navy: 'assets/images/pack1_azul_detalle.png', verde: 'assets/images/pack1_verde_detalle.png', negro: 'assets/images/pack1_negro_detalle.png', gris: 'assets/images/pack1_gris_detalle.png' },
    'pack-02':     { navy: 'assets/images/pack2_azul_detalle.png', verde: 'assets/images/pack2_verde_detalle.png', negro: 'assets/images/pack2_negro_detalle.png', gris: 'assets/images/pack2_gris_detalle.png' },
    'pack-03':     { navy: 'assets/images/pack3_azul_detalle.png', verde: 'assets/images/pack3_verde_detalle.png', negro: 'assets/images/pack3_negro_detalle.png', gris: 'assets/images/pack3_gris_detalle.png' },
    'pack-04':     { navy: 'assets/images/pack4_azul_detalle.png', verde: 'assets/images/pack4_verde_detalle.png', negro: 'assets/images/pack4_negro_detalle.png', gris: 'assets/images/pack4_gris_detalle.png' },
    'acc-estante': {
      navy:      'assets/images/accesorios%20azules/sin%20fondo/estanteazulsinfondo.png',
      verde: 'assets/images/accesorios%20verde/sin%20fondo/estanteverdesinfondo.png',
      negro:     'assets/images/accesorios%20negro/sin%20fondo/estantenegrosinfondo.png',
      gris:      'assets/images/accesorios%20gris/sin%20fondo/estantegrissinfondo.png',
    },
    'acc-control': {
      navy:      'assets/images/accesorios%20azules/sin%20fondo/bozcontrolremotoazulsinfondo.png',
      verde: 'assets/images/accesorios%20verde/sin%20fondo/boxcontrolremotoverdesinfondo.png',
      negro:     'assets/images/accesorios%20negro/sin%20fondo/boxcontrolremotonegrosinfondo.png',
      gris:      'assets/images/accesorios%20gris/sin%20fondo/boxcontrolremotogrissinfondo.png',
    },
    'acc-play': {
      navy:      'assets/images/accesorios%20azules/sin%20fondo/playazulsinfondo.png',
      verde: 'assets/images/accesorios%20verde/sin%20fondo/playverdesinfondo.png',
      negro:     'assets/images/accesorios%20negro/sin%20fondo/playnegrosinfondo.png',
      gris:      'assets/images/accesorios%20gris/sin%20fondo/playgrissinfondo.png',
    },
    'acc-gancho': {
      navy:      'assets/images/accesorios%20azules/sin%20fondo/ganchoplayazulsinfondo.png',
      verde: 'assets/images/accesorios%20verde/sin%20fondo/ganchoplayverdesinfondo.png',
      negro:     'assets/images/accesorios%20negro/sin%20fondo/ganchoplaynegrosinfondo.png',
      gris:      'assets/images/accesorios%20gris/sin%20fondo/ganchoplaygrissinfondo.png',
    },
    'acc-soporte': {
      navy:      'assets/images/accesorios%20azules/sin%20fondo/ganchocableazulsinfondo.png',
      verde: 'assets/images/accesorios%20verde/sin%20fondo/ganchoparacableverdesinfondo.png',
      negro:     'assets/images/accesorios%20negro/sin%20fondo/ganchocablenegrosinfondo.png',
      gris:      'assets/images/accesorios%20gris/sin%20fondo/ganchocablegrissinfondo.png',
    },
  };

  function getItemImg(item) {
    // Normaliza IDs que vengan de accesorios.html con color en el ID (ej: 'acc-estante-navy' → 'acc-estante')
    const baseId = item.id.replace(/-(navy|verde|negro|gris)$/, '');
    const m = itemImgMap[baseId];
    return m ? (m[item.color] || m['navy'] || null) : null;
  }

  function updateNavCount() {
    const el = document.getElementById('cart-count');
    if (el) el.textContent = Cart.count();
  }

  function renderCart() {
    const root = document.getElementById('cart-root');
    updateNavCount();

    if (Cart.items.length === 0) {
      root.innerHTML = `
        <div class="cart-empty">
          <div class="cart-empty__title">No hay nada.</div>
          <p class="cart-empty__sub">Empezá el recorrido.</p>
          <a href="shop.html" class="cart-empty__cta">Configurar paso · 01</a>
        </div>
      `;
      return;
    }

    const itemsHtml = Cart.items.map(item => {
      const imgSrc = getItemImg(item);
      return `
        <div class="cart-item" data-id="${item.id}" data-color="${item.color}">
          ${imgSrc
            ? `<img class="cart-item__img" src="${imgSrc}" alt="${item.name}">`
            : `<div style="width:100px;height:100px;background:#E8E8E8;" role="img" aria-label="${item.name}"></div>`
          }
          <div>
            <div class="cart-item__name">${item.name}</div>
            <div class="cart-item__variant">${item.variant || ''}</div>
            <div class="cart-item__controls">
              <button class="cart-qty-btn" onclick="changeQty('${item.id}','${item.color}',-1)" aria-label="Restar uno">−</button>
              <span class="cart-item__qty">${item.qty}</span>
              <button class="cart-qty-btn" onclick="changeQty('${item.id}','${item.color}',1)" aria-label="Sumar uno">+</button>
            </div>
            <button class="cart-item__remove" onclick="removeItem('${item.id}','${item.color}')">Eliminar</button>
          </div>
          <div class="cart-item__price">${item.price === 0 ? '<span style="color:#2A2623;font-weight:600;">Gratis</span>' : Cart.formatPrice(item.price * item.qty)}</div>
        </div>
      `;
    }).join('');

    const { total, pack, savings } = Cart.smartTotal();
    const cuota12 = Math.round(total / 12);
    const cuota6  = Math.round(total / 6);
    const cuota3  = Math.round(total / 3);

    root.innerHTML = `
      <div>
        <h1 class="cart-heading">Carrito</h1>
        <span class="cart-count-label">${Cart.count()} ${Cart.count() === 1 ? 'producto' : 'productos'}</span>
        <div id="cart-items">${itemsHtml}</div>
      </div>
      <div class="cart-summary">
        <div class="cart-summary__title">Resumen</div>
        ${pack ? `<div class="cart-summary__pack">· ${pack} aplicado — Ahorrás ${Cart.formatPrice(savings)}</div>` : ''}
        <div class="cart-summary__row">
          <span>Subtotal</span>
          <span>${Cart.formatPrice(total)}</span>
        </div>
        <div class="cart-summary__row">
          <span>Envío</span>
          <span style="color:#2A8048; font-weight:500;">Gratis</span>
        </div>
        <div class="cart-summary__row total">
          <span>Total</span>
          <span>${Cart.formatPrice(total)}</span>
        </div>

        <!-- Selector de cuotas -->
        <div class="cart-cuotas">
          <span class="cart-cuotas__label">Forma de pago</span>
          <div class="cuotas-options" id="cuotas-options">
            <div class="cuota-option">
              <div class="cuota-option__name">Pago único</div>
              <span class="cuota-option__amount">${Cart.formatPrice(total)}</span>
            </div>
            <div class="cuota-option">
              <div class="cuota-option__name">3 cuotas<small>sin interés</small></div>
              <span class="cuota-option__amount">${Cart.formatPrice(cuota3)} x 3</span>
            </div>
            <div class="cuota-option">
              <div class="cuota-option__name">6 cuotas<small>sin interés</small></div>
              <span class="cuota-option__amount">${Cart.formatPrice(cuota6)} x 6</span>
            </div>
            <div class="cuota-option">
              <div class="cuota-option__name">12 cuotas<small>sin interés</small></div>
              <span class="cuota-option__amount">${Cart.formatPrice(cuota12)} x 12</span>
            </div>
          </div>
        </div>

        <a href="checkout.html" class="cart-summary__btn" id="checkout-btn">Ir al checkout</a>
        <a href="shop.html" class="cart-summary__btn--outline">Seguir comprando</a>
      </div>
    `;
  }

  function changeQty(id, color, delta) {
    const item = Cart.items.find(i => i.id === id && i.color === color);
    if (!item) return;
    const newQty = item.qty + delta;
    if (newQty < 1) Cart.remove(id, color);
    else Cart.updateQty(id, color, newQty);
    renderCart();
  }

  function removeItem(id, color) {
    Cart.remove(id, color);
    renderCart();
  }

  function selectCuota(btn) {
    document.querySelectorAll('.cuota-option').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    const cuotas = btn.dataset.cuotas;
    const checkoutBtn = document.getElementById('checkout-btn');
    if (checkoutBtn) {
      checkoutBtn.href = `checkout.html?cuotas=${cuotas}`;
    }
  }

  renderCart();
</script>
<script>
  (function() {
    const items = document.querySelectorAll('.nav-item:not(.nav-logo)');
    const hl = document.getElementById('nav-hl');
    const nav = document.getElementById('navbar');
    if (!hl || !nav) return;
    function moveHl(el) {
      const nr = nav.getBoundingClientRect(), er = el.getBoundingClientRect();
      hl.style.width = er.width + 'px';
      hl.style.left = (er.left - nr.left) + 'px';
      hl.style.opacity = '1';
    }
    items.forEach(item => {
      item.addEventListener('mouseenter', () => moveHl(item));
      item.addEventListener('mouseleave', () => { hl.style.opacity = '0'; });
    });
  })();
</script>

<script>
  (function() {
    const hamburger = document.getElementById('nav-hamburger');
    const menu      = document.getElementById('mobile-menu');
    const closeBtn  = document.getElementById('mobile-menu-close');
    if (!hamburger || !menu) return;
    function openMenu()  { hamburger.classList.add('open');    menu.classList.add('open');    document.body.style.overflow = 'hidden'; }
    function closeMenu() { hamburger.classList.remove('open'); menu.classList.remove('open'); document.body.style.overflow = ''; }
    hamburger.addEventListener('click', () => menu.classList.contains('open') ? closeMenu() : openMenu());
    if (closeBtn) closeBtn.addEventListener('click', closeMenu);
    menu.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMenu));
  })();
</script>

</body>
</html>
